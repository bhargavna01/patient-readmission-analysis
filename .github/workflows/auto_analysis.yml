name: Auto Data Analysis & Update

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual execution from the GitHub Actions tab

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-state: '3.10'
        cache: 'pip'

    # 3. Install required data science and DB libraries
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install polars pandas matplotlib seaborn scikit-learn jupyter nbconvert
        # ADBC driver or psycopg2 depending on connection usage
        pip install "adbc-driver-postgresql" "adbc-driver-manager" psycopg2-binary sqlalchemy

    # 4. Execute Jupyter Notebook to run SQL queries and regenerate charts/models
    # We pass the DATABASE_URL secret as an environment variable
    - name: Run Analysis Notebook
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        jupyter nbconvert --to notebook --execute --inplace notebooks/analysis.ipynb

    # 5. Commit updated notebook and charts back to the repository if changes exist
    - name: Commit and Push Updated Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add notebooks/analysis.ipynb charts/
        # Check if there are any differences; if yes, commit and push them
        if ! git diff --cached --exit-code; then
          git commit -m "Auto-update analysis notebook and charts [skip ci]"
          git push origin main
        else
          echo "No changes in analysis output or charts to commit."
        fi
